name: Playwright Tests
on:
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    # Cron runs in UTC.
    - cron: '0 0 * * *'
jobs:
  test:
    timeout-minutes: 15
    # Pinned because ubuntu-latest is moving to Ubuntu 26, which Playwright may not support yet.
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: lts/*
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Typecheck
      run: npm run typecheck
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium
    - name: Run Playwright tests
      run: npm test
      env:
        TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
        TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
    - name: Summarize results
      if: ${{ !cancelled() }}
      run: node scripts/ci-summary.js >> "$GITHUB_STEP_SUMMARY"
    - name: Encrypt the report
      if: ${{ !cancelled() }}
      env:
        # Fingerprint of the public key in .github/report-public-key.asc (not a secret).
        REPORT_KEY_FINGERPRINT: 3DEDD56AF44E631585911382697F26AC4C702A61
      shell: bash # explicit bash enables pipefail, so a failing tar fails the step
      run: |
        gpg --batch --import .github/report-public-key.asc
        tar czf - playwright-report test-results | gpg --batch --yes --trust-model always \
          --encrypt --recipient "$REPORT_KEY_FINGERPRINT" --output report.tar.gz.gpg
    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: encrypted-report
        path: report.tar.gz.gpg
        if-no-files-found: error
        retention-days: 30
    - name: Notify Slack about the nightly run
      if: ${{ always() && github.event_name == 'schedule' }}
      # A Slack outage or a missing webhook must not turn a green test run red.
      continue-on-error: true
      uses: slackapi/slack-github-action@v4
      with:
        webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
        webhook-type: incoming-webhook
        payload: |
          text: "${{ job.status == 'success' && '✅' || '❌' }} Nightly Playwright run ${{ job.status }}: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
