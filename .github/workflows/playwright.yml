name: Playwright Tests
on:
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    # Cron runs in UTC.
    - cron: '0 0 * * *'
jobs:
  test:
    timeout-minutes: 15
    # Pinned because ubuntu-latest is moving to Ubuntu 26, which Playwright may not support yet.
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: lts/*
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Typecheck
      run: npm run typecheck
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium
    - name: Run Playwright tests
      run: npm test
      env:
        TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
        TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
    - name: Notify Slack about the nightly run
      if: ${{ always() && github.event_name != 'pull_request' }}
      # A Slack outage or a missing webhook must not turn a green test run red.
      continue-on-error: true
      uses: slackapi/slack-github-action@v2
      with:
        webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
        webhook-type: incoming-webhook
        payload: |
          text: "${{ job.status == 'success' && '✅' || '❌' }} Nightly Playwright run ${{ job.status }}: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
